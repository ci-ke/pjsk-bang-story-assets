name: Update Incremental

on:
  workflow_dispatch:
    inputs:
      skip_run_command:
        description: 'Skip pjsk'
        type: boolean
        default: false
      skip_run_command_extra:
        description: 'Skip bang'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 1-6'

jobs:
  update:
    uses: ci-ke/ProjectSekai-BangDream-story-crawler/.github/workflows/common-update.yml@main
    permissions:
      contents: write
    with:
      run_command: "uv run --no-dev -m action.assets_pjsk incremental"
      run_command_extra: "uv run --no-dev -m action.assets_bang incremental"
      commit_message: "Update incremental"
      skip_run_command: ${{ inputs.skip_run_command || false }}
      skip_run_command_extra: ${{ inputs.skip_run_command_extra || false }}